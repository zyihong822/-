<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>企业信息维护</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./overrides.css"><link rel="stylesheet" href="./modal-view.css"></head><body>
<header class="prototype-bar"><strong>企业信息维护交互原型</strong></header><div class="app-shell"><aside class="sidebar"><div class="brand"><b>D</b><strong>雕马快租</strong></div><nav><a>工作台</a><a>订单管理</a><a class="active">企业管理</a><a>场地管理</a><a>账号设置</a></nav></aside><main class="main-content"><div class="breadcrumb">企业管理 <span>/</span> 企业信息</div><header class="page-header"><h1>企业信息</h1><button id="closeButton" class="close-page" type="button" aria-label="关闭">×</button></header><form id="enterpriseForm">
<section class="info-card readonly-card"><div class="section-heading"><span></span><h2>用户信息</h2></div><div class="user-table"><div><label>用户ID</label><p>111381201749</p></div><div><label>用户昵称</label><p>L` ♧</p></div><div><label>订单来源</label><p>支付宝</p></div><div><label>授权手机号码</label><p>18664741270</p></div></div></section>
<section class="info-card"><div class="section-heading"><span></span><h2>经办人信息</h2></div><div class="form-grid three-columns"><div class="field"><label>经办人</label><div class="radios"><label><input checked name="agentRole" type="radio">企业法人</label><label><input name="agentRole" type="radio">委托代理人</label></div></div><div class="field"><label for="agentName">委托代理人姓名</label><input id="agentName" value="李水华"></div><div class="field"><label for="agentEmail">委托代理人邮箱</label><input id="agentEmail" value="li@example.com"></div><div class="field"><label for="agentId">委托代理人身份证号</label><input id="agentId" value="43102119981008751X"></div></div><div class="image-row"><div class="field"><label>身份证正面</label><div class="image-box id-front" data-image-card><span>居民身份证</span><b>李 水 华</b><div class="image-tools"><button type="button" data-preview="身份证正面">⌕</button><button type="button" data-image-delete>⌫</button></div><label class="upload-hit" for="frontId">点击上传</label><input id="frontId" type="file" accept="image/*"></div></div><div class="field"><label>身份证反面</label><div class="image-box id-back" data-image-card><span>居民身份证</span><b>中华人民共和国</b><div class="image-tools"><button type="button" data-preview="身份证反面">⌕</button><button type="button" data-image-delete>⌫</button></div><label class="upload-hit" for="backId">点击上传</label><input id="backId" type="file" accept="image/*"></div></div></div></section>
<section class="info-card"><div class="section-heading"><span></span><h2>企业信息</h2></div><div class="company-layout"><div class="field"><label>企业营业执照</label><div class="image-box license" data-image-card><em>营业执照</em><i>◎</i><b>营业执照</b><small>国家市场监督管理总局监制</small><div class="image-tools"><button type="button" data-preview="营业执照">⌕</button><button type="button" data-image-delete>⌫</button></div><label class="upload-hit" for="license">点击上传</label><input id="license" type="file" accept="image/*"></div></div><div class="form-grid"><div class="field"><label for="companyName">企业名称</label><input id="companyName" value="山东汉唐电动车科技有限公司"></div><div class="field"><label for="companyLegal">企业法人</label><input id="companyLegal" value="郭卫星"></div><div class="field"><label for="creditCode">统一社会信用代码</label><input id="creditCode" value="91370725MA3DMWX95H"></div><div class="field"><label for="address">公司地址</label><input id="address" value="山东省潍坊市昌乐县宝都街道 111 号"></div></div></div></section>
<section class="info-card"><div class="section-heading"><span></span><h2>法人信息</h2></div><div class="form-grid"><div class="field"><label for="legalName">法人姓名</label><input id="legalName" value="郭卫星"></div><div class="field"><label for="legalPhone">法人手机号</label><input id="legalPhone" value="18664741270"></div><div class="field"><label for="legalEmail">下单人邮箱</label><input id="legalEmail" value="guo@example.com"></div><div class="field verify-field"><label for="verifyCode">法人手机验证码</label><div><input id="verifyCode" placeholder="请输入验证码"><button type="button" class="text-button">发送验证码</button></div></div></div></section>
<section class="info-card supplementary"><div class="supplement-heading"><div class="section-heading"><span></span><h2>补充资料</h2></div><label class="add-button" for="supplementFile">添加<input id="supplementFile" type="file" multiple></label></div><table><thead><tr><th>文件</th><th>说明</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="supplementBody"><tr class="empty-row"><td colspan="4">暂无数据</td></tr></tbody></table></section>
<footer class="form-actions"><p id="dirtyHint" class="hidden">信息已修改，保存后生效</p><button type="button" class="secondary-btn" id="cancelButton">取消</button><button type="submit" class="primary-btn">保存</button></footer></form></main></div>
<div class="modal-backdrop hidden" id="previewModal"><div class="preview-modal"><button class="modal-close" data-close type="button">×</button><div class="preview-sheet"><span id="previewType">资料预览</span><h2 id="previewTitle">营业执照</h2><p>山东汉唐电动车科技有限公司</p></div></div></div><div class="modal-backdrop hidden" id="discardModal"><div class="confirm-modal"><h2>存在未提交的修改，确认放弃并关闭？</h2><div><button class="secondary-btn" id="continueEdit" type="button">继续编辑</button><button class="primary-btn" id="discardChanges" type="button">放弃修改</button></div></div></div><div class="toast hidden" id="toast">✓ 保存成功</div><script src="./app.js"></script></body></html>
